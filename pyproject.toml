[project]
name = "emm-social-studio"
version = "1.0.0"
description = "Automated Social Media Creation & Distribution Microservice (Upload-Post + Gemini + Reddit City Subreddits)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pillow>=11.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.34.0",
    "google-cloud-storage>=2.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
